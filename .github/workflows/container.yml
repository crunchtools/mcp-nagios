# Container release: build once per change, gate the digest, promote what was
# tested (constitution III and Container Image VII). The merge to master does
# not rebuild: it promotes the pull request's gated digest to :main, and a v*
# tag copies main's digest to the version tags and :latest. Quay.io only.

name: Container

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  schedule:
    - cron: "23 4 * * 1"   # weekly: base-image errata, gated like any build
  workflow_dispatch:

permissions: {}

jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@c50e48f8a6502674a66c412977be3c9e69ca4a8c
    permissions:
      contents: read
      pull-requests: read
    with:
      image: quay.io/crunchtools/mcp-nagios
      default-branch: master
      boot: mcp
      # Dummy settings: config loads at startup, no request reaches them.
      boot-env: |
        NAGIOS_URL=http://nagios.invalid
        NAGIOS_USER=gate
        NAGIOS_PASS=gate
      constitution-ref: c50e48f8a6502674a66c412977be3c9e69ca4a8c
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

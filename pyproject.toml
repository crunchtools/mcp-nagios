[project]
name = "mcp-nagios-crunchtools"
version = "0.2.0"
description = "Secure MCP server for Nagios Core monitoring — query status, acknowledge problems, manage checks"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [
    { name = "crunchtools.com" }
]
readme = "README.md"
keywords = ["mcp", "nagios", "monitoring", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.28",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
mcp-nagios-crunchtools = "mcp_nagios_crunchtools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_nagios_crunchtools"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "T10", "ISC", "PIE", "PT", "RET", "SIM", "TID", "TCH", "ARG", "PLC", "PLE", "PLR", "PLW", "TRY", "RUF"]
# Audited rule by rule against this codebase (RT #1482). Only rules whose
# violations are genuinely package-wide stay global; everything else is scoped
# to the files that need it below. PIE790 and PLR0913 were deleted outright --
# zero hits anywhere. PLR2004 was deleted by naming the magic 200 as HTTP_OK.
ignore = [
    "TRY003",   # 4 hits: exception messages constructed at the raise site
    "TID252",   # 13 hits: this package's own internal relative imports
]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "PLC0415"]
# main() imports .server lazily so `--help` does not load the MCP stack.
"src/mcp_nagios_crunchtools/__init__.py" = ["PLC0415"]
# Module-level lazy singletons for the client and config.
"src/mcp_nagios_crunchtools/client.py" = ["PLW0603"]
"src/mcp_nagios_crunchtools/config.py" = ["PLW0603"]
# __all__ is grouped by tool category (status, commands, history), not sorted.
"src/mcp_nagios_crunchtools/tools/__init__.py" = ["RUF022"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
